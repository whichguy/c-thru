# =============================================================================
# Scheduled live integrity, agent quality, and macOS platform verification
# =============================================================================
#
# The blocking Ubuntu matrix keeps provider and agent failures independently
# attributable. Both shards use the release pinned for the blocking contract.
# A separate latest-version agent canary is advisory, so upstream CLI drift is
# visible before the pin moves without turning @latest into the only blocker.
#
# `make test-live-shard` selects only its live registry; it does not rerun the
# deterministic suite. macOS owns one hermetic `make test` lane for platform
# behavior (BSD stat/mkdir-lock/script differences). Every test command has a
# 3,300-second process cap inside a 70-minute job lifecycle. The additional
# 15 minutes cover setup plus owned-process cleanup and artifact upload.
# Each lane writes one unique evidence file and uploads it even after failure.
# Raw failing-suite logs remain a private-repository-only, one-day,
# failure-only diagnostic artifact.
# =============================================================================

name: live-suites

on:
  schedule:
    # 07:13 UTC daily (~00:13 PT), away from the top-of-hour cron stampede.
    - cron: "13 7 * * *"
  workflow_dispatch: {}

concurrency:
  group: live-suites
  cancel-in-progress: false

jobs:
  blocking-live-shards:
    name: blocking live ${{ matrix.shard }} (Claude Code 2.1.220)
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      DISABLE_AUTOUPDATER: "1"
    strategy:
      fail-fast: false
      matrix:
        shard: [provider, agent]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pinned Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.220

      - name: Verify Claude Code
        run: claude --version

      - name: Run blocking live shard
        env:
          TMPDIR: ${{ runner.temp }}
          C_THRU_TEST_TIMEOUT_SECONDS: "3300"
          C_THRU_TEST_FAILURE_LOG_DIR: ${{ runner.temp }}/c-thru-runall-live-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          C_THRU_TEST_EVIDENCE_PATH: ${{ runner.temp }}/c-thru-evidence-live-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}.json
          C_THRU_OFFLOAD_EVIDENCE_PATH: ${{ runner.temp }}/c-thru-offload-evidence-live-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}.json
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CLOUD_TOKEN: ${{ secrets.GOOGLE_CLOUD_TOKEN }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_REGION: ${{ secrets.GOOGLE_CLOUD_REGION }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          C_THRU_INSTALL_NO_PATH: "1"
        run: make test-live-shard SHARD=${{ matrix.shard }}

      - name: Upload blocking shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-live-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/c-thru-evidence-live-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}.json
            ${{ runner.temp }}/c-thru-offload-evidence-live-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload blocking shard failure logs
        if: failure() && github.event.repository.private
        uses: actions/upload-artifact@v4
        with:
          name: run-all-fail-logs-live-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          # Raw child output is unsanitized. Private repositories only: upload
          # this run's exact directory, never a temp glob, for one day.
          path: ${{ runner.temp }}/c-thru-runall-live-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 1

  latest-agent-canary:
    name: advisory agent canary (Claude Code latest)
    runs-on: ubuntu-latest
    timeout-minutes: 70
    continue-on-error: true
    env:
      DISABLE_AUTOUPDATER: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install latest Claude Code
        run: npm install --global @anthropic-ai/claude-code@latest

      - name: Verify Claude Code
        run: claude --version

      - name: Run advisory latest agent shard
        env:
          TMPDIR: ${{ runner.temp }}
          C_THRU_TEST_TIMEOUT_SECONDS: "3300"
          C_THRU_TEST_FAILURE_LOG_DIR: ${{ runner.temp }}/c-thru-runall-agent-latest-${{ github.run_id }}-${{ github.run_attempt }}
          C_THRU_TEST_EVIDENCE_PATH: ${{ runner.temp }}/c-thru-evidence-agent-latest-${{ github.run_id }}-${{ github.run_attempt }}.json
          C_THRU_OFFLOAD_EVIDENCE_PATH: ${{ runner.temp }}/c-thru-offload-evidence-agent-latest-${{ github.run_id }}-${{ github.run_attempt }}.json
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CLOUD_TOKEN: ${{ secrets.GOOGLE_CLOUD_TOKEN }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_REGION: ${{ secrets.GOOGLE_CLOUD_REGION }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          C_THRU_INSTALL_NO_PATH: "1"
        run: make test-live-shard SHARD=agent

      - name: Upload latest-agent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-agent-latest-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/c-thru-evidence-agent-latest-${{ github.run_id }}-${{ github.run_attempt }}.json
            ${{ runner.temp }}/c-thru-offload-evidence-agent-latest-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload latest-agent failure logs
        if: failure() && github.event.repository.private
        uses: actions/upload-artifact@v4
        with:
          name: run-all-fail-logs-agent-latest-${{ github.run_id }}-${{ github.run_attempt }}
          # This exact-path artifact contains unsanitized raw child output.
          path: ${{ runner.temp }}/c-thru-runall-agent-latest-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 1

  macos-hermetic:
    name: macOS hermetic platform lane
    runs-on: macos-latest
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run macOS hermetic suite
        env:
          TMPDIR: ${{ runner.temp }}
          C_THRU_TEST_TIMEOUT_SECONDS: "3300"
          C_THRU_TEST_FAILURE_LOG_DIR: ${{ runner.temp }}/c-thru-runall-macos-hermetic-${{ github.run_id }}-${{ github.run_attempt }}
          C_THRU_TEST_EVIDENCE_PATH: ${{ runner.temp }}/c-thru-evidence-macos-hermetic-${{ github.run_id }}-${{ github.run_attempt }}.json
        run: make test

      - name: Upload macOS hermetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-macos-hermetic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/c-thru-evidence-macos-hermetic-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS hermetic failure logs
        if: failure() && github.event.repository.private
        uses: actions/upload-artifact@v4
        with:
          name: run-all-fail-logs-macos-hermetic-${{ github.run_id }}-${{ github.run_attempt }}
          # This exact-path artifact contains unsanitized raw child output.
          path: ${{ runner.temp }}/c-thru-runall-macos-hermetic-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 1
